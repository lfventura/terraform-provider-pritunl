name: GitHub Actions CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  tests:
    name: Tests (Pritunl ${{ matrix.pritunl }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.32.4469.94 predates the server option ovpn_dco (1.32.4567.52);
        # 1.34.4763.45 has it
        pritunl: ["1.32.4469.94", "1.34.4763.45"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25
      - run: make test PRITUNL_IMAGE=ghcr.io/jippi/docker-pritunl:${{ matrix.pritunl }}
